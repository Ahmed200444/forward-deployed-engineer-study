[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/github/authorize"
  to = "/.netlify/functions/github-authorize"
  status = 200
[[redirects]]
  from = "/api/github/callback"
  to = "/.netlify/functions/github-callback"
  status = 200
[[redirects]]
  from = "/api/github/status"
  to = "/.netlify/functions/github-status"
  status = 200
[[redirects]]
  from = "/api/github/preview"
  to = "/.netlify/functions/github-preview"
  status = 200
[[redirects]]
  from = "/api/github/publish"
  to = "/.netlify/functions/github-publish"
  status = 200
[[redirects]]
  from = "/api/github/disconnect"
  to = "/.netlify/functions/github-disconnect"
  status = 200
[[redirects]]
  from = "/api/github/setup"
  to = "/.netlify/functions/github-setup"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Python runtime (Pyodide 0.26.4) shipped with the site. See py/README.txt.
[[headers]]
  for = "/py/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/py/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
[[headers]]
  for = "/py/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
[[headers]]
  for = "/py/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
